name: Build AnyDownload APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Configure Keystore & Properties
        run: |
          echo "${{ secrets.BASE_64_SIGNING_KEY }}" | base64 -d > app/release_keystore.jks
          touch local.properties
          echo "${{ secrets.LOCAL_PROPERTIES }}" > keystore.properties
          chmod +x gradlew

      - name: Build github release APKs
        run: ./gradlew assembleGithubRelease --warning-mode all

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/*arm64-v8a*.apk dist/ 2>/dev/null || true
          cp app/build/outputs/apk/github/release/*universal*.apk dist/ 2>/dev/null || true
          ls -la dist/

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF_NAME}
          cat > /tmp/notes.md << EOF
          AnyDownload release $TAG

          Download the APK for your phone and install it (allow install from unknown sources when asked).

          - arm64-v8a: all modern phones (2017+, Samsung/Galaxy, Pixel, Xiaomi, OnePlus, etc.)
          - universal: everything else

          Install guide: see README.
          EOF
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "AnyDownload $TAG" \
            --notes-file /tmp/notes.md || true